<!-- Doctype indica que se trata de un documento HTML -->
<!DOCTYPE html>

<!-- La etiqueta html es la etiqueta raiz -->
<html lang="en">
    <!-- El contenido de la etiqueta head no es visible en la pagina web -->
    <head>
        <title>Document</title>
    </head>

    <!-- Dentro de body se pone todo el contenido de la pagina web -->
    <body>
        <!-- Puede incluir titulos -->
        <h1>Our Menu</h1>
        <h2>Falafel</h2>
        <p>Chickpea, herbs and spices</p>
        <h2>Pasta Salad</h2>
        <p>Lettuce, Vegetables and mozzarella</p>
    </body>
</html>
